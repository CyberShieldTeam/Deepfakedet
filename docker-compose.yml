# Historical template, not a supported startup path: this checkout has no Dockerfile.
# Use README.md and docs/DEPLOYMENT.md. Do not deploy this incomplete template as-is.
version: '3.8'

services:
  veritas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas-suraksha-suchan
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
