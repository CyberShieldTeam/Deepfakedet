name: Verify application
on:
  push:
    branches: [main, codex/integrate-figma-upgrade]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Frozen OCR baseline test reads the prior committed implementation.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run docs:check
      - run: python -m pip install -r ai_service/requirements-demo-lock.txt
      - run: python -m unittest ai_service.test_extraction_prepare ai_service.test_ocr_geometry ai_service.test_ocr_scoring ai_service.test_ocr_evaluation ai_service.test_ocr_release ai_service.test_ocr_app
      - run: npm run lint
      - run: npm run build
      - run: npm run test:startup
      - run: npm test
      - run: npm run test:media-trace
      - run: npm run test:claim-provider
      - run: npm run test:nli
      - run: npm run test:advanced-claims
      - run: npm run test:engine3
      - run: npm run test:engine4
      - run: npm run test:diagnostics
      - run: npm run test:extraction
      - run: npm run test:engine42
      - run: python -m ai_service.download_ocr
      - run: npx playwright install --with-deps chromium
      - name: Actual OCR and full UI evidence chain in both modes
        shell: bash
        run: |
          PYTHON_BIN=$(python -c 'import sys; print(sys.executable)')
          npm run demo:check -- --python "$PYTHON_BIN" --port 3337 --python-port 8417
          npm run demo:check -- --python "$PYTHON_BIN" --production --port 3338 --python-port 8418
  python-full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERITAS_IMAGE_MODEL_ENABLED: '0'
      VERITAS_AUDIO_MODEL_ENABLED: '0'
      VERITAS_FACE_MODEL_ENABLED: '0'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r ai_service/requirements.txt
      - run: python -m unittest discover -s ai_service -p 'test_*.py'
